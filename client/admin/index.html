<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Salahddine Dkaki Portfolio</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <!-- ============ LOGIN VIEW ============ -->
  <div class="login-view" id="loginView">
    <form class="login-card glass" id="loginForm">
      <h1>Admin login</h1>
      <p class="sub">Manage your portfolio's projects and messages.</p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%; justify-content:center;">Log in</button>
      <p class="status error" id="loginStatus"></p>
    </form>
  </div>

  <!-- ============ DASHBOARD VIEW ============ -->
  <div class="dashboard-view" id="dashboardView" hidden>
    <header class="admin-header">
      <div class="container header-row">
        <div class="brand">SD<span>.</span>admin</div>
        <button class="btn btn-ghost" id="logoutBtn">Log out</button>
      </div>
    </header>

    <main class="container">
      <div class="tabs">
        <button class="tab is-active" data-tab="projects">Projects</button>
        <button class="tab" data-tab="messages">Messages <span class="badge" id="unreadBadge" hidden></span></button>
      </div>

      <!-- Projects tab -->
      <section class="tab-panel is-active" id="panel-projects">
        <div class="panel-head">
          <h2>Projects</h2>
          <button class="btn btn-primary" id="newProjectBtn">+ New project</button>
        </div>

        <form class="glass project-form" id="projectForm" hidden>
          <input type="hidden" id="projectId" />
          <div class="form-row">
            <div class="field">
              <label for="title">Title</label>
              <input type="text" id="title" required />
            </div>
            <div class="field">
              <label for="order">Order (lower = shown first)</label>
              <input type="number" id="order" value="0" />
            </div>
          </div>
          <div class="field">
            <label for="description">Description</label>
            <textarea id="description" required></textarea>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="githubUrl">GitHub URL</label>
              <input type="url" id="githubUrl" placeholder="https://github.com/SALAHDDINEDKAKI/repo-name" />
            </div>
            <div class="field">
              <label for="liveUrl">Live demo URL (optional)</label>
              <input type="url" id="liveUrl" placeholder="https://..." />
            </div>
          </div>
          <div class="field">
            <label for="tags">Tags (comma-separated)</label>
            <input type="text" id="tags" placeholder="Python, SQL, Power BI" />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save project</button>
            <button type="button" class="btn btn-ghost" id="cancelProjectBtn">Cancel</button>
          </div>
        </form>

        <div class="admin-list" id="projectsList"></div>
      </section>

      <!-- Messages tab -->
      <section class="tab-panel" id="panel-messages">
        <div class="panel-head">
          <h2>Messages</h2>
        </div>
        <div class="admin-list" id="messagesList"></div>
      </section>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
